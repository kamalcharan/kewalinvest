version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Shared by kewalinvest and n8n)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kewalinvest_db
    environment:
      POSTGRES_DB: ${DB_NAME:-kewalinvest}
      POSTGRES_USER: ${DB_USER:-kewal_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Performance tuning
      POSTGRES_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-100}
      POSTGRES_SHARED_BUFFERS: ${DB_SHARED_BUFFERS:-256MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Database initialization handled by deploy.sh - no auto-init
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - kewalinvest_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kewal_admin} -d ${DB_NAME:-kewalinvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Redis for Caching and Session Management
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: kewalinvest_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kewalinvest_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # n8n Workflow Automation
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      # Database Configuration
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_NAME:-kewalinvest}
      DB_POSTGRESDB_USER: ${DB_USER:-kewal_admin}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n

      # n8n Configuration
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      VUE_APP_URL_BASE_API: http://localhost:5678/

      # Security
      N8N_USER_MANAGEMENT_DISABLED: ${N8N_USER_MANAGEMENT_DISABLED:-false}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Timezone
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      TZ: ${TIMEZONE:-Asia/Kolkata}

      # Execution settings
      EXECUTIONS_PROCESS: main
      EXECUTIONS_TIMEOUT: ${N8N_EXECUTIONS_TIMEOUT:--1}
      EXECUTIONS_TIMEOUT_MAX: ${N8N_EXECUTIONS_TIMEOUT_MAX:-3600}

      # Metrics (optional)
      N8N_METRICS: ${N8N_METRICS:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks:
      - kewalinvest_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Backend API (Node.js/Express)
  # ============================================================================
  backend:
    # Use pre-built image from Docker Hub or build locally
    image: ${DOCKER_REGISTRY:-kamalcharan}/kewalinvest-backend:${IMAGE_TAG:-latest}
    container_name: kewalinvest_backend
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-8080}

      # CORS Configuration
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}

      # Database Configuration
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kewalinvest}
      DB_USER: ${DB_USER:-kewal_admin}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # n8n Integration
      N8N_WEBHOOK_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY}

      # Application Settings
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      UPLOAD_DIR: /app/UserFiles

      # Timezone
      TZ: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - userfiles_data:/app/UserFiles
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - kewalinvest_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (adjust based on customer hardware)
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
          cpus: ${BACKEND_CPU_LIMIT:-2}
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-512M}
          cpus: ${BACKEND_CPU_RESERVATION:-0.5}

  # ============================================================================
  # Frontend (React with Nginx)
  # ============================================================================
  frontend:
    # Use pre-built image from Docker Hub or build locally
    image: ${DOCKER_REGISTRY:-kamalcharan}/kewalinvest-frontend:${IMAGE_TAG:-latest}
    container_name: kewalinvest_frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
        REACT_APP_N8N_URL: ${REACT_APP_N8N_URL:-http://localhost:5678}
    environment:
      # These are baked into the build, but can be overridden
      NGINX_HOST: ${FRONTEND_HOST:-localhost}
      NGINX_PORT: ${FRONTEND_PORT:-80}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - kewalinvest_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-512M}
          cpus: ${FRONTEND_CPU_LIMIT:-1}
        reservations:
          memory: ${FRONTEND_MEMORY_RESERVATION:-128M}
          cpus: ${FRONTEND_CPU_RESERVATION:-0.25}

  # ============================================================================
  # pgAdmin (Database Management UI)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kewalinvest_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kewalinvest.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - kewalinvest_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# Networks
# ============================================================================
networks:
  kewalinvest_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/16}

# ============================================================================
# Volumes (Persistent Data)
# ============================================================================
# Using Docker-managed named volumes for automatic handling
# Data is stored in Docker's volume directory
# To backup: docker run --rm -v kewalinvest_postgres_data:/data -v $(pwd):/backup alpine tar czf /backup/postgres_backup.tar.gz /data
volumes:
  postgres_data:
  redis_data:
  n8n_data:
  n8n_files:
  userfiles_data:
  pgadmin_data:
