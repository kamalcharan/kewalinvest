# ============================================================================
# KewalInvest - Docker Compose Production Configuration
# All values are read from .env file
# ============================================================================

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ${INSTANCE_NAME}_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT}:5432"
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ${INSTANCE_NAME}_redis
    ports:
      - "6379:6379"
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Backend API (Node.js/Express)
  # ============================================================================
  backend:
    image: ${DOCKER_REGISTRY}/kewalinvest-backend:${IMAGE_TAG}
    container_name: ${INSTANCE_NAME}_backend
    environment:
      NODE_ENV: production
      PORT: 8080

      # CORS Configuration
      CORS_ORIGIN: ${CORS_ORIGIN}

      # Database Configuration
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 30d

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Application Settings
      LOG_LEVEL: info
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: /app/UserFiles

      # Timezone
      TZ: ${TIMEZONE}
    volumes:
      - userfiles_data:/app/UserFiles
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Frontend (React Production Build with Nginx)
  # ============================================================================
  frontend:
    image: ${DOCKER_REGISTRY}/kewalinvest-frontend:${IMAGE_TAG}
    container_name: ${INSTANCE_NAME}_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # pgAdmin (Database Management UI)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${INSTANCE_NAME}_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# Networks
# ============================================================================
networks:
  app_network:
    name: ${INSTANCE_NAME}_network
    driver: bridge

# ============================================================================
# Volumes (Dynamic names from .env)
# ============================================================================
volumes:
  postgres_data:
    name: ${VOLUME_PREFIX}_postgres_data
  userfiles_data:
    name: ${VOLUME_PREFIX}_userfiles_data
  pgadmin_data:
    name: ${VOLUME_PREFIX}_pgadmin_data
